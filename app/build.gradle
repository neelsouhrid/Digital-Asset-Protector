plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.20'
}

// Load local properties
def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.assetvault'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: '/dev/null')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }

    defaultConfig {
        applicationId "com.assetvault"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties['GEMINI_API_KEY'] ?: ''}\""
        buildConfigField "String", "SUPABASE_URL", "\"${localProperties['SUPABASE_URL'] ?: ''}\""
        buildConfigField "String", "SUPABASE_KEY", "\"${localProperties['SUPABASE_KEY'] ?: ''}\""
        buildConfigField "String", "SUPABASE_SERVICE_KEY", "\"${localProperties['SUPABASE_SERVICE_KEY'] ?: ''}\""
        buildConfigField "String", "CLOUDINARY_CLOUD_NAME", "\"${localProperties['CLOUDINARY_CLOUD_NAME'] ?: ''}\""
        buildConfigField "String", "CLOUDINARY_API_KEY", "\"${localProperties['CLOUDINARY_API_KEY'] ?: ''}\""
        buildConfigField "String", "CLOUDINARY_API_SECRET", "\"${localProperties['CLOUDINARY_API_SECRET'] ?: ''}\""
        buildConfigField "String", "CLOUDINARY_UPLOAD_PRESET", "\"${localProperties['CLOUDINARY_UPLOAD_PRESET'] ?: ''}\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Activity & Fragment KTX
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

    // Room Database
    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    ksp 'androidx.room:room-compiler:2.5.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Security - Encrypted SharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Image loading
    implementation 'io.coil-kt:coil:2.4.0'

    // Work Manager (for one-time tasks)
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Web3j for blockchain
    implementation 'org.web3j:core:4.8.9-android'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Gemini AI SDK
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'

    // OpenStreetMap (osmdroid) for Map fragment
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Supabase
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:2.2.3'
    implementation 'io.github.jan-tennert.supabase:storage-kt:2.2.3'
    implementation 'io.ktor:ktor-client-android:2.3.9'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}